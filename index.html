<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nebula Arcade has moved</title>
<link rel="canonical" href="https://optimusgrok.github.io/nebula-arcade-vr-test/">
<meta http-equiv="refresh" content="2;url=https://optimusgrok.github.io/nebula-arcade-vr-test/">
<script>/* Galactic Arcade VR is now Nebula Arcade: this old link only forwards (query string + hash kept). It also unregisters this old
   link's own service worker and deletes only its own galactic-arcade_vrtest-* caches, so an installed app / old offline copy cannot stay on the old build. */
(function(){
  var to=new URL('../nebula-arcade-vr-test/',location.href.split('#')[0].split('?')[0].replace(/[^/]*$/,'')).href+location.search+location.hash;
  window.__gaMoved=to;
  var go=function(){if(go.d)return;go.d=1;location.replace(to);};
  var work=[];
  try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)work.push(navigator.serviceWorker.getRegistrations().then(function(rs){
    var me=new URL('./',location.href).href;return Promise.all(rs.filter(function(r){return r.scope===me;}).map(function(r){return r.unregister();}));}).catch(function(){}));}catch(e){}
  var clean=function(){try{if(window.caches&&caches.keys)return caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('galactic-arcade_vrtest-')===0;}).map(function(k){return caches.delete(k);}));}).catch(function(){});}catch(e){}return Promise.resolve();};
  work.push(clean());
  /* a still-running old worker can write this page's response back into its cache just after the first delete: delete once more */
  Promise.all(work).then(function(){setTimeout(function(){clean().then(go,go);},300);},go);setTimeout(go,1500);
})();</script>
<style>html,body{margin:0;height:100%;background:#05010c;color:#e8f6ff;font:600 18px/1.4 system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
h1{margin:0 0 10px;font-size:26px;color:#ff4fd8;text-shadow:0 0 12px #ff4fd8}a{color:#48f2ff;font-size:20px}</style>
</head><body><div>
<h1>Galactic Arcade VR is now Nebula Arcade</h1>
<p>Taking you to the new link&hellip;</p>
<p><a id="go" href="https://optimusgrok.github.io/nebula-arcade-vr-test/">https://optimusgrok.github.io/nebula-arcade-vr-test/</a></p>
<p style="font-size:14px;opacity:.75">On Meta Quest: remove the old app and add Nebula Arcade VR (test link) from the new link.</p>
</div><script>try{document.getElementById('go').href=window.__gaMoved||document.getElementById('go').href;}catch(e){}</script></body></html>
